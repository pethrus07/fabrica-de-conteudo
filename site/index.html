<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#144667">
<title>Estúdio de Máquinas · Celiware</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#144667;--navy2:#0E3350;--navy-fog:#E8EFF5;
  --orange:#F28A2D;--orange2:#D9731A;--orange-fog:#FEF1E5;
  --bg:#F3F5F8;--card:#FFFFFF;--well:#F7F9FB;--line:#DDE3EA;--line2:#C3CDD8;
  --ink:#0F1B26;--txt:#2B3A48;--mut:#566676;--dim:#8592A0;
  --ok:#1F8A4C;--err:#B42318;--err-fog:#FDECEA;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r1:8px;--r2:12px;--r3:16px;
  --tit:"IBM Plex Sans Condensed","IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --corpo:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--corpo);font-size:15px;line-height:1.5;padding-bottom:140px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--s4)}
.hide{display:none!important}

/* cabeçalho */
header{background:var(--navy);color:#fff;padding:var(--s5) 0 var(--s6)}
.htop{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand .lg{background:#fff;border-radius:10px;padding:6px 8px;display:grid;place-items:center}
.brand .lg img{height:26px;display:block}
.brand b{font-family:var(--tit);font-size:13px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;opacity:.8}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.18)}
h1{font-family:var(--tit);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin-top:var(--s5);letter-spacing:-.3px}
.sub{color:rgba(255,255,255,.78);margin-top:var(--s2);font-size:14.5px;max-width:560px}
.namebox{margin-top:var(--s5)}
.namebox label{display:block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:var(--s2);font-weight:600}
.namebox input{font-size:19px;font-weight:600;background:#fff;border-color:#fff}

/* campos */
input,textarea{width:100%;background:#fff;border:1px solid var(--line2);color:var(--ink);border-radius:var(--r1);padding:12px 14px;font-family:inherit;font-size:15px}
input:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-fog)}
::placeholder{color:#9AA6B2}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.field{margin-top:var(--s4)}
.field>label,.flabel{display:block;font-size:13.5px;color:var(--ink);margin-bottom:6px;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.multi{display:flex;flex-wrap:wrap;gap:var(--s2)}
.multi label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;user-select:none}
.multi input{width:17px;height:17px;accent-color:var(--navy);margin:0}
.multi label:has(input:checked){border-color:var(--navy);background:var(--navy-fog);color:var(--navy2);font-weight:600}

/* narração geral */
.narr{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:var(--s5);margin-top:calc(-1 * var(--s5));position:relative}
.narr h2{font-family:var(--tit);font-size:20px;color:var(--ink);font-weight:700}
.narr p{color:var(--mut);font-size:14px;margin-top:6px;max-width:540px}

/* painel */
.panel{margin-top:var(--s6)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.vtog{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:#fff}
.vtog button{background:none;border:none;color:var(--mut);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer}
.vtog button.on{background:var(--navy);color:#fff}
.lnk{background:none;border:none;color:var(--navy);font-size:13.5px;font-weight:600;cursor:pointer;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.ptrack{margin-top:var(--s4);height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.pfill{height:100%;background:var(--orange);width:0;border-radius:99px;transition:width .3s ease}
.ptxt{margin-top:var(--s2);font-size:12.5px;color:var(--mut)}
.chips{display:flex;gap:var(--s2);margin-top:var(--s3);overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.cur{border-color:var(--navy);color:var(--navy2);box-shadow:0 0 0 1px var(--navy) inset}
.chip .st{width:8px;height:8px;border-radius:99px;background:var(--line2)}
.chip .st.ok{background:var(--ok)}

/* bloco */
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:var(--s5);margin-top:var(--s4)}
.shead{display:flex;align-items:flex-start;gap:var(--s3)}
.snum{font-family:var(--tit);font-weight:700;font-size:15px;color:#fff;background:var(--navy);border-radius:8px;min-width:32px;height:32px;display:grid;place-items:center;flex:none;margin-top:4px}
.stitle{flex:1;min-width:0}
.stitle input{font-family:var(--tit);font-size:22px;font-weight:700;color:var(--ink);border:none;border-bottom:2px solid transparent;border-radius:0;padding:2px 0 4px;background:transparent}
.stitle input:hover{border-bottom-color:var(--line)}
.stitle input:focus{box-shadow:none;border-bottom-color:var(--navy)}
.sdesc{color:var(--mut);font-size:13.5px;margin-top:2px}
.more{flex:none;background:#fff;border:1px solid var(--line);border-radius:var(--r1);width:40px;height:40px;cursor:pointer;font-size:18px;line-height:1;color:var(--mut)}
.more:hover{border-color:var(--navy);color:var(--navy)}
.row{border:1px solid var(--line);background:var(--well);border-radius:var(--r2);padding:var(--s4);margin-top:var(--s3)}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.rowhead .rl{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--navy2);font-weight:700}
.rowctl{display:flex;gap:6px}
.mini{background:#fff;border:1px solid var(--line);color:var(--mut);border-radius:999px;height:32px;min-width:32px;padding:0 10px;font-size:12.5px;cursor:pointer}
.mini:hover{border-color:var(--navy);color:var(--navy)}
.mini:disabled{opacity:.35;cursor:default}
.row .field:first-of-type{margin-top:var(--s2)}
.addrow{margin-top:var(--s3);background:none;border:1.5px dashed var(--line2);color:var(--navy);border-radius:var(--r2);padding:13px;width:100%;cursor:pointer;font-size:14px;font-weight:600}
.addrow:hover{border-color:var(--navy)}

/* mídia */
.media{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line)}
.row .media{margin-top:var(--s4);padding-top:var(--s3)}
.mbar{display:flex;gap:var(--s2);flex-wrap:wrap}
.mbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;position:relative}
.mbtn:hover{border-color:var(--navy)}
.mbtn.rec{color:var(--mut)}
.qty{display:flex;flex-direction:column;gap:var(--s2)}
.qi{border:1px solid var(--line);border-radius:var(--r2);background:#fff;padding:8px 8px 8px 14px}
.qi.on{border-color:var(--navy);background:var(--navy-fog);padding-bottom:12px}
.qh{display:flex;align-items:center;gap:var(--s3)}
.qh .qn{flex:1;font-weight:600;color:var(--ink);font-size:14.5px}
.qh .qn small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;background:#fff;flex:none}
.step button{width:42px;height:42px;border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--navy);border-radius:999px}
.step button:disabled{opacity:.3;cursor:default}
.step b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);font-size:16px}
.qitens{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3);padding-right:6px}
.qitens label{display:flex;align-items:center;gap:var(--s2)}
.qitens label span{flex:none;min-width:22px;font-weight:700;color:var(--navy2);font-size:13px}
.qitens input{padding:10px 12px;font-size:14.5px}
.narr textarea{margin-top:var(--s4);min-height:140px}
.ou{font-size:13px;color:var(--mut);margin-top:var(--s4)}
.ou+.media{margin-top:var(--s2);padding-top:0;border-top:none}
.mbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mbtn svg{width:17px;height:17px;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3);margin-top:var(--s3)}
.mgrid:empty{display:none}
.mi{background:var(--well);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;position:relative;display:flex;flex-direction:column}
.mi .pv{aspect-ratio:4/3;background:#E6EBF0;display:grid;place-items:center;overflow:hidden}
.mi .pv img,.mi .pv video{width:100%;height:100%;object-fit:cover;display:block}
.mi .pv .ic{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.mi .mf{padding:8px 10px 10px}
.mi .mn{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .cap{margin-top:6px;font-size:13px;padding:7px 9px}
.mi .x{position:absolute;top:6px;right:6px;background:rgba(15,27,38,.72);color:#fff;border:none;width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:13px}
.mi.au{grid-column:1/-1;flex-direction:row;align-items:center;gap:var(--s3);padding:10px 48px 10px 12px}
.mi.au audio{flex:1;min-width:0;height:40px}
.mi.au .mn{flex:none;max-width:40%}
.mi .busy{position:absolute;inset:0;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--navy)}

/* adicionar / vazio */
.addsec{margin-top:var(--s5);width:100%;border:1.5px dashed var(--line2);background:none;color:var(--navy);border-radius:var(--r3);padding:20px;font-size:15px;font-weight:600;cursor:pointer}
.addsec:hover{border-color:var(--navy);background:#fff}
.start{margin-top:var(--s6)}
.start h2{font-family:var(--tit);font-size:22px;color:var(--ink)}
.start p{color:var(--mut);margin-top:6px;font-size:14px}
.types{display:grid;gap:var(--s3);margin-top:var(--s4)}
.type{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);cursor:pointer}
.type:hover{border-color:var(--navy)}
.type .tn{font-weight:700;color:var(--ink);font-size:15px}
.type .td{color:var(--mut);font-size:13px;margin-top:3px}

/* navegação passo a passo */
.gnav{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4)}
.gnav .gpos{flex:1;text-align:center;font-size:13px;color:var(--mut)}
.gbtn{background:#fff;border:1px solid var(--line2);color:var(--ink);border-radius:999px;padding:13px 22px;font-size:14px;font-weight:600;cursor:pointer}
.gbtn.next{background:var(--navy);border-color:var(--navy);color:#fff}
.gbtn:disabled{opacity:.35;cursor:default}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:var(--s3) 0 calc(var(--s3) + env(safe-area-inset-bottom));z-index:50}
.bar .wrap{display:flex;align-items:center;gap:var(--s3);justify-content:space-between}
.count{color:var(--mut);font-size:12.5px;line-height:1.4}
.count b{color:var(--ink)}
.btn{background:var(--orange);color:var(--ink);border:none;border-radius:999px;padding:14px 26px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F59A45}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.navy{background:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy2)}
.btn2{background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:999px;padding:13px 22px;font-size:14px;font-weight:600;cursor:pointer}
.btn2:hover{border-color:var(--navy)}
.btn2.danger{color:var(--err)}
.btn2.danger:hover{border-color:var(--err)}

/* gravação */
.recbar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--ink);color:#fff;padding:var(--s4) 0 calc(var(--s4) + env(safe-area-inset-bottom))}
.recbar .wrap{display:flex;align-items:center;gap:var(--s4)}
.recdot{width:14px;height:14px;border-radius:99px;background:#FF4D3D;flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.rectx{flex:1;min-width:0}
.rectx b{font-size:20px;font-variant-numeric:tabular-nums;font-family:var(--tit)}
.rectx small{display:block;color:rgba(255,255,255,.7);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recmeter{height:4px;background:rgba(255,255,255,.15);border-radius:99px;margin-top:6px;overflow:hidden}
.recmeter i{display:block;height:100%;width:0;background:var(--orange);transition:width .1s}
.recstop{background:#fff;color:var(--ink);border:none;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15px;cursor:pointer;display:flex;gap:8px;align-items:center}
.recstop i{width:12px;height:12px;background:#FF4D3D;border-radius:2px}

/* modais */
.ov{position:fixed;inset:0;background:rgba(15,27,38,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:var(--s4)}
.ov.show{display:flex}
.box{background:#fff;border-radius:18px;padding:var(--s6);max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(15,27,38,.25)}
.box h3{font-family:var(--tit);font-size:24px;color:var(--ink);margin-bottom:6px}
.box .bp{color:var(--mut);font-size:14px}
.mbtns{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s5)}
.list{margin-top:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.li{display:flex;align-items:center;gap:var(--s3);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;background:var(--well)}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;color:var(--ink);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lt small{color:var(--mut);font-size:12.5px}
.li.cur{border-color:var(--navy);background:var(--navy-fog)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s4)}
.lib button{text-align:left;background:var(--well);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;cursor:pointer}
.lib button:hover{border-color:var(--navy);background:#fff}
.lib .ln{font-weight:700;font-size:14px;color:var(--ink)}
.lib .ld{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.acts{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s4)}
.acts button{text-align:left;background:var(--well);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.acts button:hover{border-color:var(--navy)}
.acts button.danger{color:var(--err)}
.acts button:disabled{opacity:.4;cursor:default}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:var(--s4)}
.prog i{display:block;height:100%;width:0;background:var(--orange);transition:width .2s}
.progtx{font-size:13px;color:var(--mut);margin-top:var(--s2);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--mut);background:var(--well);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-top:var(--s4)}
.note.warn{background:var(--orange-fog);border-color:#F6C79B;color:#7A3E06}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:200;display:flex;flex-direction:column;gap:var(--s2);align-items:center;width:min(92vw,520px);pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:#fff;border-radius:var(--r2);padding:12px 16px;font-size:13.5px;box-shadow:0 10px 30px rgba(15,27,38,.3);animation:tin .2s ease both}
.toast.err{background:var(--err)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:640px){
  input,textarea{font-size:16px}
  header{padding:var(--s4) 0 var(--s6)}
  h1{margin-top:var(--s4)}
  .narr,section.card{padding:var(--s4)}
  .box{padding:var(--s5) var(--s4);border-radius:18px 18px 0 0;max-height:92vh}
  .ov{align-items:flex-end;padding:0}
  .lib{grid-template-columns:1fr}
  .stitle input{font-size:20px}
  .pair{grid-template-columns:1fr}
  .pair.keep{grid-template-columns:1fr 1fr}
  .mgrid{grid-template-columns:1fr 1fr}
  .bar .wrap{flex-direction:column;align-items:stretch;gap:var(--s2)}
  .count{text-align:center}
  .btn{width:100%}
  .gbtn{flex:1;padding:13px 10px}
  .gnav{flex-wrap:wrap}
  .gnav .gpos{order:-1;flex-basis:100%}
  body{padding-bottom:170px}
  #toasts{bottom:150px}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="htop">
    <div class="brand"><span class="lg"><img src="logo.png" alt="Celiware"></span><b>Celiware</b></div>
    <button class="hbtn" id="bmaq" type="button">Máquinas</button>
  </div>
  <h1>Estúdio de Máquinas</h1>
  <p class="sub">Escreva o que você sabe da máquina e anexe fotos, vídeos e documentos. Se for mais rápido, grave um áudio. No final, gere o pacote e mande para o Pedro: os arquivos vão do jeito que foram feitos, sem perder qualidade.</p>
  <div class="namebox">
    <label for="nome">Nome da máquina</label>
    <input id="nome" placeholder="Ex.: Envasadora EV-20" autocomplete="off">
  </div>
</div></header>

<div class="wrap">
  <div class="narr" id="narr"></div>
  <div id="main"></div>
</div>

<div class="bar" id="bar"><div class="wrap">
  <div class="count" id="count"></div>
  <button class="btn" id="gen" type="button">Gerar pacote (.zip)</button>
</div></div>

<div class="recbar hide" id="recbar"><div class="wrap">
  <span class="recdot"></span>
  <div class="rectx"><b id="rect">00:00</b><small id="recw"></small><div class="recmeter"><i id="recm"></i></div></div>
  <button class="recstop" id="recstop" type="button"><i></i>Parar</button>
</div></div>

<div class="ov" id="ov"><div class="box" role="dialog" aria-modal="true" id="box"></div></div>
<div id="toasts"></div>

<script>
"use strict";
/* ================= blocos ================= */
const ENTREGAS=[
  {nome:"Vídeo",desc:"curto, para assistir no celular",ph:"Sobre o quê? Ex.: operação do dia a dia"},
  {nome:"Manual",desc:"documento completo, em PDF",ph:"Qual? Ex.: operação, manutenção"},
  {nome:"Guia rápido",desc:"1 ou 2 páginas para imprimir",ph:"Sobre o quê? Ex.: partida e parada"},
  {nome:"Cartaz de parede",desc:"A3, fica do lado da máquina",ph:"Sobre o quê? Ex.: segurança da faca"},

let DB;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("celiware-estudio",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("proj",{keyPath:"id"});d.createObjectStore("blobs");d.createObjectStore("thumbs")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=DB.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("abortado"))})}
const dbGet=(st,k)=>tx(st,"readonly",s=>s.get(k));
const dbPut=(st,v,k)=>tx(st,"readwrite",s=>k===undefined?s.put(v):s.put(v,k));
const dbDel=(st,k)=>tx(st,"readwrite",s=>s.delete(k));
const dbAll=st=>tx(st,"readonly",s=>s.getAll());

const URLS=new Map();
async function urlOf(id,thumb){const key=(thumb?"t:":"")+id;if(URLS.has(key))return URLS.get(key);let b=thumb?await dbGet("thumbs",id):null;if(!b)b=await dbGet("blobs",id);if(!b)return null;const u=URL.createObjectURL(b);URLS.set(key,u);return u}

const PENDING=new Set();
function kindOf(type,name){if(/^image\//.test(type))return"foto";if(/^video\//.test(type))return"video";if(/^audio\//.test(type))return"audio";const e=(name||"").split(".").pop().toLowerCase();if(["jpg","jpeg","png","heic","heif","webp"].includes(e))return"foto";if(["mp4","mov","m4v","3gp","webm","mkv"].includes(e))return"video";if(["m4a","mp3","ogg","opus","wav","aac","amr"].includes(e))return"audio";return"arquivo"}
async function makeThumb(blob){try{let bmp;try{bmp=await createImageBitmap(blob,{resizeWidth:360,resizeQuality:"medium"})}catch(e){bmp=await createImageBitmap(blob)}const r=Math.min(1,360/bmp.width);const c=document.createElement("canvas");c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close&&bmp.close();return await new Promise(res=>c.toBlob(res,"image/jpeg",.75))}catch(e){return null}}
async function addMedia(sid,rid,blob,name,extra){
  const arr=midsOf(sid,rid);if(!arr)return;
  const id=uid("a");const kind=(extra&&extra.kind)||kindOf(blob.type,name);
  P.meta[id]={name:name||("arquivo-"+id),type:blob.type||"",size:blob.size,kind,legenda:"",criado:new Date().toISOString(),...(extra||{})};
  arr.push(id);PENDING.add(id);save();rerenderMedia(sid,rid);
  try{await dbPut("blobs",blob,id);if(kind==="foto"){const t=await makeThumb(blob);if(t)await dbPut("thumbs",t,id)}persistOnce()}
  catch(e){const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);delete P.meta[id];toast("Não coube no aparelho: "+name+" ("+e.message+")",1)}

/* ================= gravação de áudio ================= */
let REC=null;
async function startRec(sid,rid){
  if(REC)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("Este navegador não grava áudio. Grave no app do celular e use \"Anexar áudio\".",1);return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}})}
  catch(e){toast("Sem acesso ao microfone. Libere a permissão no navegador e tente de novo.",1);return}
  const mt=["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  const mr=new MediaRecorder(stream,mt?{mimeType:mt,audioBitsPerSecond:128000}:{audioBitsPerSecond:128000});
  REC={mr,stream,sid,rid,chunks:[],t0:Date.now(),type:mr.mimeType||mt||"audio/webm"};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};
  mr.start(1000);
  REC.tick=setInterval(()=>{$("#rect").textContent=fmtT((Date.now()-REC.t0)/1000)},250);
  REC.bak=setInterval(()=>{if(REC&&REC.chunks.length)dbPut("blobs",{pid:P.id,sid,rid,type:REC.type,t0:REC.t0,blob:new Blob(REC.chunks,{type:REC.type})},"__rec").catch(()=>{})},5000);
  try{REC.wake=await navigator.wakeLock.request("screen")}catch(e){}
  try{const ac=new (window.AudioContext||window.webkitAudioContext)();const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(stream).connect(an);const buf=new Uint8Array(an.fftSize);REC.ac=ac;REC.meter=setInterval(()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));$("#recm").style.width=Math.min(100,m/128*160)+"%"},100)}catch(e){}
  const h=sid==="narr"?"pedido geral":(()=>{const s=secById(sid);return s?s.titulo+(rid?" · "+LIB[s.tipo].rep.rotulo+" "+(s.rows.findIndex(r=>r.id===rid)+1):""):""})();
  $("#recw").textContent="Gravando: "+h;$("#rect").textContent="00:00";
  $("#recbar").classList.remove("hide");$("#bar").classList.add("hide");
}
function stopRec(){
  if(!REC)return;const R=REC;
  R.mr.onstop=async()=>{
    clearInterval(R.tick);clearInterval(R.bak);clearInterval(R.meter);try{R.ac&&R.ac.close()}catch(e){}
    R.stream.getTracks().forEach(t=>t.stop());try{R.wake&&R.wake.release()}catch(e){}
    const dur=(Date.now()-R.t0)/1000;const blob=new Blob(R.chunks,{type:R.type});
    REC=null;$("#recbar").classList.add("hide");$("#bar").classList.remove("hide");
    const ext=/mp4/.test(R.type)?"m4a":/ogg/.test(R.type)?"ogg":"webm";
    const d=new Date(R.t0);const nm=`gravacao-${d.toISOString().slice(0,10)}_${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}${String(d.getSeconds()).padStart(2,"0")}.${ext}`;
    await addMedia(R.sid,R.rid,blob,nm,{kind:"audio",dur,gravado:true});
    dbDel("blobs","__rec").catch(()=>{});
    toast("Áudio guardado ("+fmtT(dur)+")");
  };
  R.mr.stop();
}
async function recoverRec(){
  const r=await dbGet("blobs","__rec").catch(()=>null);if(!r||!r.blob)return;
  if(r.pid!==P.id)return;
  const ok=holder(r.sid,r.rid)?r:{...r,sid:"narr",rid:""};
  const ext=/mp4/.test(r.type)?"m4a":/ogg/.test(r.type)?"ogg":"webm";
  await addMedia(ok.sid,ok.rid,r.blob,"gravacao-recuperada-"+new Date(r.t0).toISOString().slice(0,16).replace(/[:T]/g,"")+"."+ext,{kind:"audio",recuperado:true});
  await dbDel("blobs","__rec");toast("Recuperei uma gravação que tinha sido interrompida.");
}

/* ================= ZIP (sem compressão, ZIP64, montado por referência) ================= */
/*ZIP-BEGIN*/
const CRC_T=(()=>{const t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
async function crc32Blob(blob,onp){let c=-1;const CH=4<<20;for(let o=0;o<blob.size;o+=CH){const b=new Uint8Array(await blob.slice(o,Math.min(blob.size,o+CH)).arrayBuffer());for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);onp&&onp(b.length)}return(c^-1)>>>0}
function dosDT(d){return{time:(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date:((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}}
/* entries: [{name, blob}] → Blob do .zip. Os dados entram como referência ao Blob original (não são copiados para a memória). */
async function buildZip(entries,onp,force64){
  const enc=new TextEncoder();const parts=[];const cd=[];let off=0;const now=dosDT(new Date());const MAX=0xFFFFFFFF;
  for(const e of entries){
    const name=enc.encode(e.name);const size=e.blob.size;const crc=await crc32Blob(e.blob,onp);
    const z64=force64||size>=MAX||off>=MAX;
    const lx=z64?20:0;const lh=new DataView(new ArrayBuffer(30+name.length+lx));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,z64?45:20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,now.time,true);lh.setUint16(12,now.date,true);lh.setUint32(14,crc,true);

/* lê um .zip sem compressão (o que este app gera) → [{name, blob}] por fatia do arquivo, sem carregar tudo */
async function readZip(file){
  const tail=Math.min(file.size,65557);const tb=new DataView(await file.slice(file.size-tail).arrayBuffer());
  let p=-1;for(let i=tail-22;i>=0;i--)if(tb.getUint32(i,true)===0x06054b50){p=i;break}
  if(p<0)throw new Error("não é um .zip válido");
  let n=tb.getUint16(p+10,true),cdSize=tb.getUint32(p+12,true),cdOff=tb.getUint32(p+16,true);
  if(n===0xFFFF||cdOff===0xFFFFFFFF||cdSize===0xFFFFFFFF){
    const lp=p-20;if(lp<0||tb.getUint32(lp,true)!==0x07064b50)throw new Error("ZIP64 sem localizador");
    const zo=Number(tb.getBigUint64(lp+8,true));const z=new DataView(await file.slice(zo,zo+56).arrayBuffer());
    n=Number(z.getBigUint64(32,true));cdSize=Number(z.getBigUint64(40,true));cdOff=Number(z.getBigUint64(48,true));
  }
  const cdv=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());const dec=new TextDecoder();const out=[];let q=0;
  for(let k=0;k<n;k++){
    if(cdv.getUint32(q,true)!==0x02014b50)throw new Error("diretório do .zip corrompido");
    const method=cdv.getUint16(q+10,true);let size=cdv.getUint32(q+24,true);let usize=cdv.getUint32(q+20,true);let lo=cdv.getUint32(q+42,true);
    const nl=cdv.getUint16(q+28,true),xl=cdv.getUint16(q+30,true),cl=cdv.getUint16(q+32,true);
    const name=dec.decode(new Uint8Array(cdv.buffer,q+46,nl));
    let x=q+46+nl;const xe=x+xl;
    while(x+4<=xe){const id=cdv.getUint16(x,true),sz=cdv.getUint16(x+2,true);if(id===1){let y=x+4;if(usize===0xFFFFFFFF){usize=Number(cdv.getBigUint64(y,true));y+=8}if(size===0xFFFFFFFF){size=Number(cdv.getBigUint64(y,true));y+=8}if(lo===0xFFFFFFFF){lo=Number(cdv.getBigUint64(y,true))}}x+=4+sz}
    if(method!==0&&size>0)throw new Error("o .zip foi recompactado por outro programa — use o .zip original gerado pelo Estúdio");
    const lh=new DataView(await file.slice(lo,lo+30).arrayBuffer());const ds=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    out.push({name,blob:file.slice(ds,ds+size)});q=xe+cl;
  }
  return out;
}

/* ================= pacote ================= */
let GERANDO=false;
function extOf(m){const e=(m.name.match(/\.([a-z0-9]{1,5})$/i)||[])[1];if(e)return e.toLowerCase();const t=m.type||"";return/jpeg/.test(t)?"jpg":/png/.test(t)?"png":/quicktime/.test(t)?"mov":/mp4/.test(t)?(m.kind==="audio"?"m4a":"mp4"):/webm/.test(t)?"webm":/ogg/.test(t)?"ogg":"bin"}
function nomeArq(m,i){const base=m.gravado||m.recuperado?"":"_"+slug(m.name.replace(/\.[^.]+$/,"")).slice(0,40);const pre={foto:"foto",video:"video",audio:"audio",arquivo:"arquivo"}[m.kind];return`${pre}-${String(i).padStart(2,"0")}${base}.${extOf(m)}`}
function txt(v){if(v&&typeof v==="object"&&!Array.isArray(v))return qtyAtivos(v).map(e=>`${e.tipo} × ${e.quantidade}`+(e.itens.some(Boolean)?` (${e.itens.map((x,i)=>`${i+1}. ${x||"sem descrição"}`).join("; ")})`:"")).join(" · ");return Array.isArray(v)?v.join(", "):String(v||"").trim()}
function montarPacote(){
  const raiz=`${slug(P.nome)}_${new Date().toISOString().slice(0,10)}/`;
  const files=[];const paths={};
  const addSet=(mids,dir)=>{const cnt={};return mids.filter(id=>P.meta[id]).map(id=>{const m=P.meta[id];cnt[m.kind]=(cnt[m.kind]||0)+1;const path=dir+nomeArq(m,cnt[m.kind]);paths[id]=path;files.push({id,path});return{arquivo:path,tipo:m.kind,nome_original:m.name,legenda:m.legenda||"",tamanho_bytes:m.size,mime:m.type,...(m.dur?{duracao_s:Math.round(m.dur)}:{}),...(m.gravado?{gravado_no_estudio:true}:{})}})};
  const narr=addSet(P.narr,"00-narracao/");
  const usados=P.secs.filter(hasContent);
  const blocos=usados.map((s,i)=>{
    const L=LIB[s.tipo];const dir=`${String(i+1).padStart(2,"0")}-${slug(s.titulo)}/`;
    const campos={};[...(L.campos||[]),...(L.depois||[])].forEach(c=>{const v=txt(s.vals[c.k]);if(v)campos[c.k]={rotulo:c.l,valor:v}});
    const o={ordem:i+1,bloco:s.tipo,bloco_nome:L.nome,titulo:s.titulo,pasta:dir,campos};
    if(L.rep){o.itens=s.rows.filter(r=>rowFilled(L,r)).map((r,j)=>{const cc={};L.rep.campos.forEach(c=>{const v=txt(r.vals[c.k]);if(v)cc[c.k]={rotulo:c.l,valor:v}});const rd=`${dir}${slug(L.rep.rotulo)}-${String(j+1).padStart(2,"0")}/`;return{ordem:j+1,rotulo:`${L.rep.rotulo} ${j+1}`,campos:cc,midia:addSet(r.mid,rd)}})}
    o.midia=addSet(s.mid,dir);return o});
  const vazios=P.secs.filter(s=>!hasContent(s)).map(s=>s.titulo);
  const st=stats();
  const pe=P.secs.filter(s=>s.tipo==="pedido").flatMap(s=>qtyAtivos(s.vals.entregas));
  const pedido={app:"celiware-estudio",versao:1,maquina:P.nome,gerado_em:new Date().toISOString(),pedido_escrito:String(P.narrTxt||"").trim(),entregas:pe.map(e=>({tipo:e.tipo,quantidade:e.quantidade,itens:e.itens.map((x,i)=>({numero:i+1,sobre:x}))})),resumo:{blocos:usados.length,blocos_vazios:vazios,fotos:st.foto,videos:st.video,audios:st.audio,arquivos:st.arquivo,bytes:st.bytes},narracao:narr,blocos,_estado:P,_arquivos:paths};
  return{raiz,files,pedido,vazios};
}
function resumoMD(pk){
  const p=pk.pedido;const L=[];
  L.push(`# ${p.maquina}`,"",`Gerado em ${new Date(p.gerado_em).toLocaleString("pt-BR")} pelo Estúdio de Máquinas · Celiware.`,"");
  L.push(`**${p.resumo.blocos}** blocos · **${p.resumo.fotos}** fotos · **${p.resumo.videos}** vídeos · **${p.resumo.audios}** áudios · **${p.resumo.arquivos}** arquivos · ${fmtB(p.resumo.bytes)}`,"");
  if(p.pedido_escrito)L.push("## O que o cliente pediu","",p.pedido_escrito,"");
  if(p.entregas.length){L.push("## Entregas","");p.entregas.forEach(e=>{L.push(`- **${e.tipo} × ${e.quantidade}**`);e.itens.forEach(x=>L.push(`  ${x.numero}. ${x.sobre||"(sem descrição)"}`))});L.push("")}
  if(p.narracao.length){L.push("## Narração geral","");p.narracao.forEach(m=>L.push(`- \`${m.arquivo}\`${m.duracao_s?` (${fmtT(m.duracao_s)})`:""}`));L.push("")}
  const mlist=ms=>ms.forEach(m=>L.push(`- ${m.tipo}: \`${m.arquivo}\`${m.legenda?` — ${m.legenda}`:""}${m.duracao_s?` (${fmtT(m.duracao_s)})`:""}`));
  p.blocos.forEach(b=>{
    L.push(`## ${b.ordem}. ${b.titulo}`,"");
    Object.values(b.campos).forEach(c=>L.push(`**${c.rotulo}:** ${c.valor}`,""));
    (b.itens||[]).forEach(it=>{L.push(`### ${it.rotulo}`,"");Object.values(it.campos).forEach(c=>L.push(`- **${c.rotulo}:** ${c.valor}`));mlist(it.midia);L.push("")});
    if(b.midia.length){L.push("**Arquivos do bloco:**","");mlist(b.midia);L.push("")}
  });
  if(p.resumo.blocos_vazios.length)L.push("## Blocos deixados em branco","",...p.resumo.blocos_vazios.map(t=>`- ${t}`),"");
  return L.join("\n");
}
const LEIA=`# Leia primeiro

Pacote gerado pelo **Estúdio de Máquinas · Celiware**. É a entrada da produção de vídeos e manuais.

## O que tem aqui

- \`RESUMO.md\` — tudo o que foi escrito, bloco por bloco, com a lista de arquivos de cada um.
- \`pedido.json\` — o mesmo conteúdo em formato estruturado. A chave \`_estado\` permite reabrir o pacote no Estúdio ("Máquinas › Continuar de um .zip").
- \`00-narracao/\` — áudios gerais: o que o cliente quer, dito por ele.
- \`NN-bloco/\` — uma pasta por bloco, na ordem do formulário. Itens (passos, componentes, problemas) têm subpasta própria.

## Regras de leitura

1. **Os arquivos são os originais.** Foto, vídeo e áudio entram byte a byte, sem compressão nem conversão. O .zip também não comprime (modo STORE).
2. **Áudio é conteúdo, não anexo.** Transcrever antes de produzir; muito do que importa foi dito, não escrito.
3. **Valor e unidade vêm separados** na ficha técnica e nos parâmetros: copiar exatamente, nunca arredondar.
4. **"Tem que aparecer exatamente assim"** e **"Não pode aparecer"** (bloco Regras) valem para todas as peças.
5. O que não estiver aqui não é inventado: vira pergunta para o cliente.
`;
async function gerar(){
  if(GERANDO)return;
  if(!P.nome.trim()){toast("Dê um nome para a máquina antes de gerar o pacote.",1);$("#nome").focus();scrollTo({top:0,behavior:"smooth"});return}
  await flush().catch(()=>{});
  if(PENDING.size){toast("Espere terminar de guardar os arquivos.",1);return}
  const pk=montarPacote();
  if(!pk.pedido.blocos.length&&!pk.pedido.narracao.length&&!pk.pedido.pedido_escrito){toast("Ainda não há nada preenchido.",1);return}
  if(pk.vazios.length&&!await confirma("Gerar o pacote?",`${pk.vazios.length} bloco(s) em branco ficam de fora: ${esc(pk.vazios.join(", "))}.`,"Gerar mesmo assim"))return;
  GERANDO=true;
  modal(`<h3>Montando o pacote</h3><p class="bp">Conferindo cada arquivo. Não feche esta tela.</p><div class="prog"><i id="pgb"></i></div><div class="progtx" id="pgt"></div>`);
  try{
    const enc=new TextEncoder();
    const ent=[];const falt=[];
    for(const f of pk.files){const b=await dbGet("blobs",f.id);if(!b){falt.push(f.path);continue}if(b.size!==P.meta[f.id].size){falt.push(f.path+" (tamanho diferente)");continue}ent.push({name:pk.raiz+f.path,blob:b})}
    if(falt.length)throw new Error("arquivo(s) sumiram deste aparelho: "+falt.join(", "));
    ent.unshift({name:pk.raiz+"LEIA-PRIMEIRO.md",blob:new Blob([enc.encode(LEIA)])},{name:pk.raiz+"RESUMO.md",blob:new Blob([enc.encode(resumoMD(pk))])},{name:pk.raiz+"pedido.json",blob:new Blob([enc.encode(JSON.stringify(pk.pedido,null,2))])});
    const total=ent.reduce((a,e)=>a+e.blob.size,0);let done=0;
    const zip=await buildZip(ent,n=>{done+=n;$("#pgb").style.width=(done/total*100)+"%";$("#pgt").textContent=`${fmtB(done)} de ${fmtB(total)}`});
    const nome=`${slug(P.nome)}_${new Date().toISOString().slice(0,10)}.zip`;
    GERANDO=false;
    const share=navigator.canShare&&(()=>{try{return navigator.canShare({files:[new File([zip],nome,{type:"application/zip"})]})}catch(e){return false}})();
    const u=URL.createObjectURL(zip);
    const a=await modal(`<h3>Pacote pronto</h3><p class="bp"><b>${esc(nome)}</b> · ${fmtB(zip.size)}<br>${ent.length-3} arquivo(s) de mídia, todos na qualidade original.</p>
      <div class="mbtns"><a class="btn navy" href="${u}" download="${esc(nome)}" style="text-decoration:none" id="dl">Baixar o .zip</a>${share?`<button class="btn2" type="button" data-close="share">Compartilhar</button>`:""}</div>
      ${zip.size>2e9?`<p class="note warn">Passa de 2 GB: o WhatsApp não aceita. Mande pelo Google Drive ou por cabo.</p>`:""}
      <p class="note">O pacote continua guardado aqui. Se mudar alguma coisa, é só gerar de novo.</p>
      <div class="mbtns"><button class="btn2" type="button" data-close>Fechar</button></div>`);
    if(a==="share"){try{await navigator.share({files:[new File([zip],nome,{type:"application/zip"})],title:nome})}catch(e){if(e.name!=="AbortError")toast("Não deu para compartilhar: "+e.message,1)}}
    setTimeout(()=>URL.revokeObjectURL(u),120000);
  }catch(e){GERANDO=false;closeModal(null);toast("Não consegui gerar o pacote: "+e.message,1)}
}

/* ================= continuar de um .zip ================= */
async function importZip(file){
  closeModal(null);
  let ents;try{ents=await readZip(file)}catch(e){toast("Não consegui abrir o .zip: "+e.message,1);return}
  const pj=ents.find(e=>/(^|\/)pedido\.json$/.test(e.name));
  if(!pj){toast("Esse .zip não foi gerado pelo Estúdio (falta o pedido.json).",1);return}
  let ped;try{ped=JSON.parse(await pj.blob.text())}catch(e){toast("pedido.json ilegível.",1);return}
  if(ped.app!=="celiware-estudio"||!ped._estado){toast("Esse .zip não foi gerado pelo Estúdio.",1);return}
  const raiz=pj.name.replace(/pedido\.json$/,"");const map=new Map(ents.map(e=>[e.name,e.blob]));
  const np=ped._estado;const exist=await dbGet("proj",np.id);
  if(exist&&!await confirma("Substituir \""+(exist.nome||"Sem nome")+"\"?","Essa máquina já está neste aparelho. A versão do .zip substitui a daqui.","Substituir"))return;
  modal(`<h3>Abrindo o pacote</h3><p class="bp">Guardando os arquivos neste aparelho.</p><div class="prog"><i id="pgb"></i></div><div class="progtx" id="pgt"></div>`);
  try{
    if(exist)await removeMany(Object.keys(exist.meta||{}));
    const ids=Object.keys(ped._arquivos||{});let k=0;const falt=[];
    for(const id of ids){const b=map.get(raiz+ped._arquivos[id]);if(!b){falt.push(id);continue}const m=np.meta[id];const blob=new Blob([b],{type:m.type||""});await dbPut("blobs",blob,id);if(m.kind==="foto"){const t=await makeThumb(blob);if(t)await dbPut("thumbs",t,id)}k++;$("#pgb").style.width=(k/ids.length*100)+"%";$("#pgt").textContent=`${k} de ${ids.length} arquivos`}
    const tira=h=>{h.mid=h.mid.filter(id=>!falt.includes(id)&&np.meta[id]&&ped._arquivos[id])};
    np.narr=np.narr.filter(id=>ped._arquivos[id]&&!falt.includes(id));np.secs.forEach(s=>{tira(s);s.rows.forEach(tira)});
    Object.keys(np.meta).forEach(id=>{if(!ped._arquivos[id]||falt.includes(id))delete np.meta[id]});
    URLS.forEach(u=>URL.revokeObjectURL(u));URLS.clear();
    P=migrar(np);await dbPut("proj",JSON.parse(JSON.stringify(P)));try{localStorage.setItem("ce-cur",P.id)}catch(e){}
    closeModal(null);render();scrollTo({top:0});toast(`"${P.nome}" aberta com ${k} arquivo(s).`);
  }catch(e){closeModal(null);toast("Falhou ao abrir: "+e.message,1)}
}
